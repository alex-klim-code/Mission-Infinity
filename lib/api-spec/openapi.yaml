openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: Mission Infinity Phase 1 cooperative game API
servers:
  - url: /api
paths:
  /game/story-images/{name}:
    get:
      operationId: getStoryImage
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum: [graduation-warsaw.webp, nasa-internship.webp, nasa-engineering.webp, falcon-shadow.webp, titan-explorer.webp, nova-prime.webp]
      responses:
        '200':
          description: Optimized mission story illustration
          content:
            image/webp:
              schema: { type: string, format: binary }
  /healthz:
    get:
      operationId: healthCheck
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
  /game/catalog:
    get:
      operationId: getGameCatalog
      responses:
        '200':
          description: Public mission and character content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalog' }
  /game/me:
    get:
      operationId: getPlayer
      responses:
        '200':
          description: Current authenticated player
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerAccount' }
  /game/character:
    put:
      operationId: saveCharacter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CharacterInput' }
      responses:
        '200':
          description: Saved character
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Player' }
  /game/avatar-config:
    get:
      operationId: getAvatarConfig
      responses:
        '200':
          description: Free Avaturn pilot configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarConfig' }
  /game/avatar-uploads:
    post:
      operationId: requestAvatarUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvatarUploadInput' }
      responses:
        '201':
          description: Direct upload authorization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarUpload' }
  /game/avatar-uploads/{id}/complete:
    post:
      operationId: completeAvatarUpload
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Validated immutable avatar asset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarAsset' }
  /game/avatar-files/{id}:
    get:
      operationId: getAvatarFile
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Saved GLB or PNG asset, visible to signed-in players
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /game/social:
    get:
      operationId: getSocial
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 40 }
      responses:
        '200':
          description: Friends, requests, invitations and search results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Social' }
  /game/friend-actions:
    post:
      operationId: updateFriendship
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FriendAction' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
  /game/sessions:
    post:
      operationId: createGameSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionInput' }
      responses:
        '201':
          description: Created game session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameSession' }
  /game/sessions/{id}:
    get:
      operationId: getGameSession
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Authorized session state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameSession' }
  /game/sessions/{id}/actions:
    post:
      operationId: updateGameSession
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionAction' }
      responses:
        '200':
          description: Authoritative updated state or null after leaving
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResult' }
  /game/sessions/{id}/demo-plan:
    get:
      operationId: getDemoPlan
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Read-only, budget-aware demo recommendations for this session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoPlan' }
  /game/sessions/{id}/engineering-advice:
    post:
      operationId: previewEngineering
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EngineeringPreview' }
      responses:
        '200':
          description: Compatibility preview; no purchase or random outcome
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EngineeringAdvice' }
  /game/sessions/{id}/messages:
    get:
      operationId: getSessionMessages
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: before, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Persistent crew history, oldest first, up to 50 messages per page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionChatPage' }
    post:
      operationId: sendSessionMessage
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionMessageInput' }
      responses:
        '200':
          description: Session after durably saving the message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameSession' }
  /game/sessions/{id}/invitations:
    post:
      operationId: invitePlayer
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationInput' }
      responses:
        '200':
          description: Invitation persisted and delivered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
  /game/invitations/{id}:
    post:
      operationId: respondToInvitation
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationResponse' }
      responses:
        '200':
          description: Accepted session or declined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResult' }
  /game/career:
    get:
      operationId: getCareer
      responses:
        '200':
          description: Real player progression
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Career' }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    ActionResult:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
    CharacterAppearance:
      type: object
      additionalProperties: false
      required: [version, base, face, skinTone, hairstyle, hairColor, countryCode, avatarSeed]
      properties:
        version: { type: integer, enum: [1] }
        base: { type: string, enum: [female, male] }
        face: { type: string, enum: [calm, focused, bright, confident] }
        skinTone: { type: string, enum: ['614335', 'd08b5b', 'ae5d29', 'edb98a', 'ffdbb4'] }
        hairstyle: { type: string, enum: [shortFlat, shortCurly, theCaesar, bob, bun, curly, straight01, fro, shavedSides, longButNotTooLong] }
        hairColor: { type: string, enum: ['2c1b18', '4a312c', '724133', 'a55728', 'b58143', 'd6b370', 'ecdcbf', 'e8e1e1'] }
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        avatarSeed: { type: string, minLength: 1, maxLength: 100, pattern: '^[A-Za-z0-9:_-]+$' }
    AvatarConfig:
      type: object
      required: [configured, editorUrl, maxModelBytes, maxPortraitBytes, customUniformSupported]
      properties:
        configured: { type: boolean }
        editorUrl: { type: [string, 'null'] }
        maxModelBytes: { type: integer }
        maxPortraitBytes: { type: integer }
        customUniformSupported: { type: boolean, enum: [false] }
    AvatarUploadInput:
      type: object
      required: [kind, size]
      properties:
        kind: { type: string, enum: [model, portrait] }
        size: { type: integer, minimum: 20, maximum: 20971520 }
    AvatarUpload:
      type: object
      required: [id, uploadUrl, contentType]
      properties:
        id: { type: string, format: uuid }
        uploadUrl: { type: string }
        contentType: { type: string, enum: [model/gltf-binary, image/png] }
    AvatarAsset:
      type: object
      required: [id, url, kind]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        kind: { type: string, enum: [model, portrait] }
    Avatar3DInput:
      type: object
      required: [modelUploadId, avatarId, bodyId, gender, avatarSupportsFaceAnimations]
      properties:
        modelUploadId: { type: string, format: uuid }
        portraitUploadId: { type: string, format: uuid }
        avatarId: { type: string, minLength: 1, maxLength: 128 }
        bodyId: { type: string, minLength: 1, maxLength: 128 }
        gender: { type: string, enum: [female, male] }
        avatarSupportsFaceAnimations: { type: boolean }
    Avatar3D:
      allOf:
        - { $ref: '#/components/schemas/Avatar3DInput' }
        - type: object
          required: [version, provider, modelUrl, portraitUrl]
          properties:
            version: { type: integer, enum: [1] }
            provider: { type: string, enum: [avaturn] }
            modelUrl: { type: string }
            portraitUrl: { type: [string, 'null'] }
    CharacterInput:
      type: object
      required: [name, age, gender]
      properties:
        name: { type: string, minLength: 3, maxLength: 24 }
        age: { type: integer, minimum: 14, maximum: 60 }
        gender: { type: string, enum: [female, male, unspecified] }
        presetId: { type: string }
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        appearance:
          anyOf:
            - { $ref: '#/components/schemas/CharacterAppearance' }
            - { type: 'null' }
        avatar3d:
          anyOf:
            - { $ref: '#/components/schemas/Avatar3DInput' }
            - { type: 'null' }
    Player:
      type: object
      required: [id, name, age, gender, presetId, online]
      properties:
        id: { type: string }
        name: { type: string }
        age: { type: integer }
        gender: { type: string, enum: [female, male, unspecified] }
        presetId: { type: string }
        countryCode: { type: [string, 'null'] }
        appearance:
          anyOf:
            - { $ref: '#/components/schemas/CharacterAppearance' }
            - { type: 'null' }
        avatar3d:
          anyOf:
            - { $ref: '#/components/schemas/Avatar3D' }
            - { type: 'null' }
        online: { type: boolean }
    PlayerAccount:
      type: object
      required: [id, character, activeSessionId]
      properties:
        id: { type: string }
        character:
          anyOf:
            - { $ref: '#/components/schemas/Player' }
            - { type: 'null' }
        activeSessionId: { type: [string, 'null'] }
    CharacterPreset:
      type: object
      required: [id, label, image]
      properties:
        id: { type: string }
        label: { type: string }
        image: { type: string }
    Mission:
      type: object
      required: [id, number, title, subtitle, description, difficulty, enabled, budget, developmentMonths, operationalYears, destination, objectives, requirements, image, briefing]
      properties:
        id: { type: string }
        number: { type: string }
        title: { type: string }
        subtitle: { type: string }
        description: { type: string }
        difficulty: { type: string }
        enabled: { type: boolean }
        budget: { type: number }
        developmentMonths: { type: integer }
        operationalYears: { type: integer }
        operationalWeeks: { type: integer }
        destination: { type: string }
        objectives: { type: array, items: { type: string } }
        requirements: { type: array, items: { type: string } }
        image: { type: string }
        briefing: { type: array, items: { $ref: '#/components/schemas/BriefingSection' } }
    BriefingSection:
      type: object
      required: [title, text]
      properties:
        title: { type: string }
        text: { type: string }
    StoryScene:
      type: object
      required: [id, title, label, speaker, paragraphs, soloParagraphs, image]
      properties:
        id: { type: integer }
        title: { type: string }
        label: { type: string }
        speaker: { type: string }
        paragraphs: { type: array, items: { type: string } }
        soloParagraphs: { type: array, items: { type: string } }
        image: { type: string }
    Catalog:
      type: object
      required: [missions, presets, scenes, rocketCatalog]
      properties:
        scienceScoring: { $ref: '#/components/schemas/ScienceScoring' }
        payloadProfiles:
          type: object
          additionalProperties: { $ref: '#/components/schemas/PayloadProfile' }
        rocketCatalog: { type: array, items: { $ref: '#/components/schemas/RocketSection' } }
        scientificInstruments: { type: array, items: { $ref: '#/components/schemas/ScientificInstrument' } }
        missions: { type: array, items: { $ref: '#/components/schemas/Mission' } }
        presets: { type: array, items: { $ref: '#/components/schemas/CharacterPreset' } }
        scenes: { type: array, items: { $ref: '#/components/schemas/StoryScene' } }
    ScienceScoring:
      type: object
      description: Rules shared with the Stage 8 report. Forecasts assume all selected science points are earned.
      required: [maxSciencePoints, objectiveWeight, totalMissionWeight]
      properties:
        maxSciencePoints: { type: number, minimum: 1 }
        objectiveWeight: { type: number, minimum: 0 }
        totalMissionWeight: { type: number, minimum: 1 }
    Invitation:
      type: object
      required: [id, sessionId, from, to, missionTitle, expiresAt, direction, status]
      properties:
        id: { type: string }
        sessionId: { type: string }
        from: { $ref: '#/components/schemas/Player' }
        to: { $ref: '#/components/schemas/Player' }
        missionTitle: { type: string }
        expiresAt: { type: string }
        direction: { type: string, enum: [incoming, outgoing] }
        status: { type: string }
    Social:
      type: object
      required: [friends, incoming, sent, search, invitations]
      properties:
        friends: { type: array, items: { $ref: '#/components/schemas/Player' } }
        incoming: { type: array, items: { $ref: '#/components/schemas/Player' } }
        sent: { type: array, items: { $ref: '#/components/schemas/Player' } }
        search: { type: array, items: { $ref: '#/components/schemas/Player' } }
        invitations: { type: array, items: { $ref: '#/components/schemas/Invitation' } }
    FriendAction:
      type: object
      required: [action, targetId]
      properties:
        action: { type: string, enum: [send, accept, reject, cancel, remove] }
        targetId: { type: string }
    SessionInput:
      type: object
      required: [missionId, mode]
      properties:
        missionId: { type: string }
        mode: { type: string, enum: [solo, crew] }
    SessionMessageInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 180 }
    SessionMessage:
      type: object
      required: [id, text, createdAt, expiresAt]
      properties:
        id: { type: string }
        text: { type: string }
        createdAt: { type: string }
        expiresAt: { type: string }
    SessionPlayer:
      type: object
      required: [player, ready, continueReady, accepted, connected]
      properties:
        player: { $ref: '#/components/schemas/Player' }
        ready: { type: boolean }
        continueReady: { type: boolean }
        accepted: { type: boolean }
        connected: { type: boolean }
        lastMessage:
          anyOf:
            - { $ref: '#/components/schemas/SessionMessage' }
            - { type: 'null' }
    SessionChatMessage:
      allOf:
        - { $ref: '#/components/schemas/SessionMessage' }
        - type: object
          required: [playerId, name]
          properties:
            playerId: { type: string }
            name: { type: string }
    SessionChatPage:
      type: object
      required: [messages, hasMore]
      properties:
        messages: { type: array, items: { $ref: '#/components/schemas/SessionChatMessage' } }
        hasMore: { type: boolean }
    GameSession:
      type: object
      required: [id, roomCode, hostId, missionId, status, scene, players, createdAt, revision]
      properties:
        id: { type: string }
        roomCode: { type: string }
        hostId: { type: string }
        missionId: { type: string }
        status: { type: string, enum: [LOBBY, STORY, MISSION_BRIEFING, MISSION_ACCEPTANCE, READY_TO_START, MISSION_STARTED, CLOSED] }
        scene: { type: integer }
        revision: { type: integer }
        players: { type: array, items: { $ref: '#/components/schemas/SessionPlayer' } }
        chat: { $ref: '#/components/schemas/SessionChatPage' }
        build: { $ref: '#/components/schemas/RocketBuild' }
        assembly: { $ref: '#/components/schemas/RocketAssembly' }
        science: { $ref: '#/components/schemas/ScienceLoadout' }
        fueling: { $ref: '#/components/schemas/FuelLoad' }
        journey: { $ref: '#/components/schemas/MissionJourney' }
        engineering: { $ref: '#/components/schemas/EngineeringState' }
        finance: { $ref: '#/components/schemas/MissionFinance' }
        createdAt: { type: string }
    RocketBuild:
      type: object
      required: [screen, selectedHullId, spent, elapsedMonths, votes]
      properties:
        screen: { type: string, enum: [INTRO, HULL_SELECTION, HULL_CONFIRMED] }
        selectedHullId: { type: [string, 'null'] }
        spent: { type: integer }
        elapsedMonths: { type: integer }
        votes: { type: array, items: { $ref: '#/components/schemas/HullVote' } }
    HullVote:
      type: object
      required: [playerId, hullId]
      properties:
        playerId: { type: string }
        hullId: { type: string }
    SessionAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [ready, start, next, accept, initiate, leave, continue-ready, build-next, choose-hull, confirm-hull, choose-component, confirm-component, finish-rocket, open-science, propose-instruments, purchase-instruments, open-fueling, set-fuel-target, connect-fuel-hose, disconnect-fuel-hose, start-fueling, fuel-tick, pause-fueling, confirm-fuel, start-construction, journey-tick, open-briefing, briefing-continue, confirm-briefing-date, launch-flight, check-instruments, continue-lunar, start-landing, set-landing-thrust, collect-site, start-return, view-results, rebuild-rocket, request-funding, funding-tick, repair-weather-launch] }
        acceptedIssueIds: { type: array, maxItems: 20, uniqueItems: true, items: { type: string } }
        requestId: { type: string, format: uuid }
        amount: { type: integer, minimum: 1000000, maximum: 400000000 }
        reason: { type: string, minLength: 10, maxLength: 600 }
        thrust: { type: number, minimum: 0, maximum: 100 }
        confirmReturn: { type: boolean, description: 'Explicit Leader confirmation after opening the pre-return hardware check.' }
        siteId: { type: string, enum: [regolith, crater, ridge] }
        briefingDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        quantityKg: { type: integer, minimum: 0, maximum: 30000 }
        instrumentIds: { type: array, maxItems: 13, uniqueItems: true, items: { type: string } }
        optionId: { type: string }
        hullId: { type: string, enum: [falcon-shadow, titan-explorer, nova-prime] }
        ready: { type: boolean }
        expectedScene: { type: integer }
    ScientificInstrument:
      type: object
      required: [id, name, group, price, massKg, powerW, quality, maxSciencePoints, description, scientificPurpose]
      properties:
        id: { type: string }
        name: { type: string }
        group: { type: string, enum: [camera, sample-collection, sample-container, optional] }
        price: { type: integer }
        massKg: { type: number }
        powerW: { type: [number, 'null'] }
        quality: { type: integer }
        maxSciencePoints: { type: integer }
        description: { type: string }
        scientificPurpose: { type: string }
    InstrumentProposal:
      type: object
      required: [playerId, instrumentIds]
      properties:
        playerId: { type: string }
        instrumentIds: { type: array, items: { type: string } }
    ScienceLoadout:
      type: object
      required: [opened, completed, instrumentIds, spent, proposals]
      properties:
        opened: { type: boolean }
        completed: { type: boolean }
        instrumentIds: { type: array, items: { type: string } }
        spent: { type: integer }
        proposals: { type: array, items: { $ref: '#/components/schemas/InstrumentProposal' } }
        massLimitKg: { type: [number, 'null'], description: 'Dynamic maximum payload, or null when physical specifications are incomplete. Never a fixed limit.' }
        creditedEquipment: { type: array, items: { $ref: '#/components/schemas/ScienceEquipmentCredit' } }
    ScienceEquipmentCredit:
      type: object
      required: [categoryId, optionId, name, group, massKg, quality]
      properties:
        categoryId: { type: string }
        optionId: { type: string }
        name: { type: string }
        group: { type: string, enum: [sample-collection, sample-container] }
        massKg: { type: [number, 'null'] }
        quality: { type: [number, 'null'] }
    MissionJourney:
      type: object
      required: [construction, phase, weather, briefingDate, plan, flight, diagnostics, diagnosticsProgress, diagnosticsComplete, availableSciencePoints, maxSciencePoints]
      properties:
        launchFailure:
          anyOf:
            - { $ref: '#/components/schemas/LaunchAttempt' }
            - { type: 'null' }
        flightAlerts: { type: array, items: { $ref: '#/components/schemas/HardwareCheck' } }
        construction: { $ref: '#/components/schemas/MissionConstruction' }
        phase: { type: string, enum: [NONE, ROUTE, CALENDAR, MISSION_DAY, FLIGHT, MOON_ARRIVAL, DIAGNOSTICS, LUNAR_OPERATIONS, FAILED, LANDING, SAMPLE_COLLECTION, LANDING_FAILED, RETURN_FLIGHT, RETURN_FAILED, REENTRY, RECOVERY, RESULTS, LAUNCH_FAILURE] }
        operations:
          anyOf:
            - { $ref: '#/components/schemas/MissionOperations' }
            - { type: 'null' }
        weather: { type: array, items: { $ref: '#/components/schemas/MissionWeather' } }
        briefingDate: { type: [string, 'null'] }
        plan:
          anyOf:
            - { $ref: '#/components/schemas/MissionFlightPlan' }
            - { type: 'null' }
        flight: { $ref: '#/components/schemas/MissionFlightTelemetry' }
        diagnostics: { type: array, items: { $ref: '#/components/schemas/InstrumentDiagnostic' } }
        diagnosticsProgress: { type: number }
        diagnosticsComplete: { type: boolean }
        availableSciencePoints: { type: number }
        maxSciencePoints: { type: integer }
    MissionConstruction:
      type: object
      required: [opened, startedAt, durationMs, months, cost, progress, elapsedMonths, delivered, legacy]
      properties:
        opened: { type: boolean }
        startedAt: { type: [string, 'null'] }
        durationMs: { type: integer }
        months: { type: integer }
        cost: { type: integer }
        progress: { type: number }
        elapsedMonths: { type: integer }
        delivered: { type: boolean }
        legacy: { type: boolean }
    DemoPlan:
      type: object
      required: [feasible, partIds, instrumentIds, additionalCost, estimatedTotalSpent, remainingBudget, fuelReserveCost, recommendedFuelKg, message, assumptions]
      properties:
        feasible: { type: boolean }
        partIds: { type: array, items: { type: string } }
